<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Valle wiring: Raspberry Pi → L298N → two DC motors</text>

  <!-- Raspberry Pi -->
  <rect x="30" y="60" width="230" height="330" rx="10" fill="#1f7a3a"/>
  <text x="145" y="85" text-anchor="middle" fill="#fff" font-weight="bold" font-size="15">Raspberry Pi</text>
  <text x="145" y="102" text-anchor="middle" fill="#d8f0de" font-size="11">BCM numbering (physical pin)</text>
  <g fill="#fff" font-size="12">
    <text x="50" y="135">GPIO12 (pin 32)</text>
    <text x="50" y="170">GPIO5  (pin 29)</text>
    <text x="50" y="205">GPIO6  (pin 31)</text>
    <text x="50" y="240">GPIO13 (pin 33)</text>
    <text x="50" y="275">GPIO20 (pin 38)</text>
    <text x="50" y="310">GPIO21 (pin 40)</text>
    <text x="50" y="345">GND    (pin 39)</text>
  </g>
  <rect x="70" y="360" width="150" height="22" rx="4" fill="#0d4a22"/>
  <text x="145" y="375" text-anchor="middle" fill="#fff" font-size="11">CSI ← Pi Camera ribbon</text>

  <!-- L298N -->
  <rect x="430" y="60" width="200" height="380" rx="10" fill="#b3261e"/>
  <text x="530" y="85" text-anchor="middle" fill="#fff" font-weight="bold" font-size="15">L298N driver</text>
  <g fill="#fff" font-size="12">
    <text x="445" y="135">ENA *</text>
    <text x="445" y="170">IN1</text>
    <text x="445" y="205">IN2</text>
    <text x="445" y="240">ENB *</text>
    <text x="445" y="275">IN3</text>
    <text x="445" y="310">IN4</text>
    <text x="445" y="345">GND</text>
    <text x="445" y="380">+12V / VS</text>
    <text x="560" y="135">OUT1</text>
    <text x="560" y="170">OUT2</text>
    <text x="560" y="275">OUT3</text>
    <text x="560" y="310">OUT4</text>
  </g>

  <!-- signal wires -->
  <g stroke-width="3" fill="none">
    <line x1="260" y1="131" x2="430" y2="131" stroke="#e69f00"/>
    <line x1="260" y1="166" x2="430" y2="166" stroke="#0072b2"/>
    <line x1="260" y1="201" x2="430" y2="201" stroke="#56b4e9"/>
    <line x1="260" y1="236" x2="430" y2="236" stroke="#e69f00"/>
    <line x1="260" y1="271" x2="430" y2="271" stroke="#009e73"/>
    <line x1="260" y1="306" x2="430" y2="306" stroke="#7fc97f"/>
    <line x1="260" y1="341" x2="430" y2="341" stroke="#000"/>
  </g>
  <g font-size="11" fill="#444">
    <text x="345" y="125" text-anchor="middle">PWM left speed</text>
    <text x="345" y="230" text-anchor="middle">PWM right speed</text>
    <text x="345" y="335" text-anchor="middle">common ground (required)</text>
  </g>

  <!-- Motors -->
  <circle cx="790" cy="150" r="48" fill="#555"/>
  <text x="790" y="146" text-anchor="middle" fill="#fff" font-weight="bold">Left</text>
  <text x="790" y="162" text-anchor="middle" fill="#fff">motor</text>
  <circle cx="790" cy="290" r="48" fill="#555"/>
  <text x="790" y="286" text-anchor="middle" fill="#fff" font-weight="bold">Right</text>
  <text x="790" y="302" text-anchor="middle" fill="#fff">motor</text>
  <g stroke-width="3" fill="none">
    <path d="M630 131 H700 L745 140" stroke="#d62728"/>
    <path d="M630 166 H700 L745 160" stroke="#222"/>
    <path d="M630 271 H700 L745 280" stroke="#d62728"/>
    <path d="M630 306 H700 L745 300" stroke="#222"/>
  </g>

  <!-- Battery -->
  <rect x="660" y="400" width="200" height="70" rx="8" fill="#f2c14e" stroke="#9a7a1c" stroke-width="2"/>
  <text x="760" y="428" text-anchor="middle" font-weight="bold" fill="#222">Motor battery</text>
  <text x="760" y="446" text-anchor="middle" fill="#222" font-size="11">7–12 V (e.g. 2S Li-ion / 6×AA)</text>
  <path d="M700 400 V376 H630" stroke="#d62728" stroke-width="3" fill="none"/>
  <path d="M660 455 H560 V440" stroke="#000" stroke-width="3" fill="none"/>
  <text x="560" y="490" font-size="11" fill="#444">battery + → VS,  − → GND</text><text x="530" y="425" text-anchor="middle" font-size="11" fill="#fff">* remove EN jumpers</text>

  <!-- Pi power -->
  <rect x="30" y="420" width="230" height="50" rx="8" fill="#eee" stroke="#999"/>
  <text x="145" y="442" text-anchor="middle" font-weight="bold" fill="#222">Pi power: 5 V USB-C</text>
  <text x="145" y="458" text-anchor="middle" font-size="11" fill="#444">separate supply, not from L298N</text>

  <text x="450" y="520" text-anchor="middle" font-size="12" fill="#444">Battery −, L298N GND and Pi GND must all be tied together. Never power motors from the Pi's 5 V pins.</text>
</svg>
