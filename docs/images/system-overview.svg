  <text x="625" y="112" text-anchor="middle" font-size="11">drive / reflex</text>
  <line x1="572" y1="150" x2="680" y2="150" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="625" y="168" text-anchor="middle" font-size="11">MJPEG frames</text>
