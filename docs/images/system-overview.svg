  <rect x="30" y="70" width="180" height="90" rx="10" fill="#eef" stroke="#557"/>
  <text x="120" y="105" text-anchor="middle" font-weight="bold">iPhone / Siri</text>
  <text x="120" y="125" text-anchor="middle" font-size="11">Shortcuts → GET /forward …</text>

  <rect x="330" y="60" width="240" height="250" rx="10" fill="#e8f5ec" stroke="#1f7a3a" stroke-width="2"/>
